<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>러시안 룰렛</title>
<style>
	:root { --red: #c0392b; --fg: #e8e2d6; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; color: var(--fg); font-family: "Noto Sans KR", system-ui, sans-serif; }
	canvas { display: block; }
	#hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
	#top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
	h1 { margin: 0; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; text-shadow: 0 2px 8px #000; }
	#stats { text-align: right; font-size: 14px; line-height: 1.6; text-shadow: 0 2px 6px #000; }
	#stats b { font-size: 20px; color: #ffd27a; }
	#bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 8px; }
	#msg { min-height: 1.6em; font-size: 18px; text-align: center; text-shadow: 0 2px 8px #000; }
	#odds { font-size: 13px; opacity: 0.8; }
	.row { display: flex; gap: 12px; pointer-events: auto; }
	button { font: inherit; font-weight: 700; letter-spacing: 0.08em; padding: 14px 26px; border-radius: 8px; border: 1px solid #5a5248; background: #1c1a17; color: var(--fg); cursor: pointer; transition: transform .1s, background .15s, opacity .2s; }
	button:hover:not(:disabled) { background: #2a2622; transform: translateY(-1px); }
	button:disabled { opacity: 0.35; cursor: default; }
	button#pull { background: var(--red); border-color: #e0584a; }
	button#pull:hover:not(:disabled) { background: #d94434; }
	#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
	#over { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(120, 0, 0, 0.55); backdrop-filter: blur(3px); text-align: center; }
	#over.show { display: flex; }
	#over h2 { margin: 0; font-size: clamp(44px, 12vw, 110px); letter-spacing: 0.12em; color: #fff; text-shadow: 0 0 30px #f00; }
	#over p { margin: 0 0 12px; font-size: 20px; }
	@media (max-width: 520px) { h1 { font-size: 16px; } button { padding: 12px 18px; } }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
	<div id="top">
		<h1>Russian Roulette</h1>
		<div id="stats">생존 <b id="score">0</b>회<br>최고 기록 <b id="best">0</b>회</div>
	</div>
	<div id="bottom">
		<div id="msg"></div>
		<div id="odds"></div>
		<div class="row">
			<button id="spin">탄창 돌리기 (S)</button>
			<button id="pull">방아쇠 당기기 (Space)</button>
		</div>
	</div>
</div>
<div id="flash"></div>
<div id="over">
	<h2>BANG!</h2>
	<p id="overText"></p>
	<button id="again" style="pointer-events:auto">다시 하기</button>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CHAMBERS = 6;
const STEP = Math.PI * 2 / CHAMBERS;

// ---------- DOM ----------
const $ = id => document.getElementById( id );
const msgEl = $( 'msg' ), oddsEl = $( 'odds' ), scoreEl = $( 'score' ), bestEl = $( 'best' );
const spinBtn = $( 'spin' ), pullBtn = $( 'pull' ), againBtn = $( 'again' );
const overEl = $( 'over' ), overText = $( 'overText' ), flashEl = $( 'flash' );

let best = 0;
try { best = parseInt( localStorage.getItem( 'roulette-best' ) || '0', 10 ) || 0; } catch ( e ) {}
bestEl.textContent = best;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.setPixelRatio( Math.min( devicePixelRatio, 2 ) );
renderer.setSize( innerWidth, innerHeight );
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.prepend( renderer.domElement );

const scene = new THREE.Scene();
scene.background = new THREE.Color( 0x070605 );
scene.fog = new THREE.Fog( 0x070605, 8, 22 );
const pmrem = new THREE.PMREMGenerator( renderer );
scene.environment = pmrem.fromScene( new RoomEnvironment(), 0.04 ).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera( 40, innerWidth / innerHeight, 0.1, 50 );
const camBase = new THREE.Vector3( -4.2, 3.0, 9.2 );
const camTarget = new THREE.Vector3( 0.9, -0.3, 0 );

const spot = new THREE.SpotLight( 0xffe2b0, 260, 0, 0.55, 0.6, 2 );
spot.position.set( -2, 7, 4 );
spot.target.position.set( 0.5, 0, 0 );
spot.castShadow = true;
spot.shadow.mapSize.set( 2048, 2048 );
spot.shadow.bias = - 0.0004;
scene.add( spot, spot.target );
const rim = new THREE.DirectionalLight( 0x6f8cff, 0.6 );
rim.position.set( 5, 3, - 4 );
scene.add( rim );

// table
const table = new THREE.Mesh(
	new THREE.PlaneGeometry( 40, 40 ),
	new THREE.MeshStandardMaterial( { color: 0x1d2a1f, roughness: 0.95 } )
);
table.rotation.x = - Math.PI / 2;
table.position.y = - 2.1;
table.receiveShadow = true;
scene.add( table );

// ---------- revolver ----------
const steel = new THREE.MeshStandardMaterial( { color: 0x8a8d93, metalness: 1, roughness: 0.28 } );
const darkSteel = new THREE.MeshStandardMaterial( { color: 0x2b2d31, metalness: 1, roughness: 0.4 } );
const wood = new THREE.MeshStandardMaterial( { color: 0x6b3d1e, roughness: 0.55, metalness: 0.05 } );
const hole = new THREE.MeshBasicMaterial( { color: 0x000000 } );
const brass = new THREE.MeshStandardMaterial( { color: 0xd8a64a, metalness: 1, roughness: 0.25 } );

function mesh( geo, mat, x = 0, y = 0, z = 0, parent ) {

	const m = new THREE.Mesh( geo, mat );
	m.position.set( x, y, z );
	m.castShadow = m.receiveShadow = true;
	( parent || gun ).add( m );
	return m;

}

const gun = new THREE.Group();
scene.add( gun );

// cylinder (rotates around X axis)
const cyl = new THREE.Group();
gun.add( cyl );
const R_RING = 0.46;
mesh( new THREE.CylinderGeometry( 0.78, 0.78, 1.2, 48 ).rotateZ( Math.PI / 2 ), steel, 0, 0, 0, cyl );
const rounds = [];
for ( let i = 0; i < CHAMBERS; i ++ ) {

	const a = i * STEP, y = R_RING * Math.cos( a ), z = R_RING * Math.sin( a );
	const h = new THREE.Mesh( new THREE.CylinderGeometry( 0.17, 0.17, 1.24, 20 ).rotateZ( Math.PI / 2 ), hole );
	h.position.set( 0, y, z );
	cyl.add( h );
	const r = mesh( new THREE.CylinderGeometry( 0.14, 0.14, 0.22, 20 ).rotateZ( Math.PI / 2 ), brass, - 0.55, y, z, cyl );
	r.visible = false;
	rounds.push( r );
	// flutes
	mesh( new THREE.CylinderGeometry( 0.09, 0.09, 1.0, 12 ).rotateZ( Math.PI / 2 ), darkSteel, 0, 0.78 * Math.cos( a + STEP / 2 ), 0.78 * Math.sin( a + STEP / 2 ), cyl );

}
mesh( new THREE.CylinderGeometry( 0.12, 0.12, 1.5, 16 ).rotateZ( Math.PI / 2 ), darkSteel, 0, 0, 0, cyl ); // center pin

// frame, barrel, grip
mesh( new THREE.BoxGeometry( 1.7, 1.3, 0.5 ), darkSteel, - 1.45, 0.25, 0 );
mesh( new THREE.BoxGeometry( 1.4, 0.18, 0.42 ), darkSteel, 0.05, 0.9, 0 ); // top strap
mesh( new THREE.CylinderGeometry( 0.2, 0.22, 2.9, 24 ).rotateZ( Math.PI / 2 ), steel, 2.0, R_RING, 0 ); // barrel
mesh( new THREE.BoxGeometry( 2.0, 0.26, 0.3 ), darkSteel, 1.6, 0.05, 0 ); // under lug
mesh( new THREE.BoxGeometry( 0.12, 0.12, 0.1 ), steel, 3.4, R_RING + 0.27, 0 ); // front sight
const grip = mesh( new THREE.BoxGeometry( 0.9, 2.3, 0.56 ), wood, - 2.15, - 1.0, 0 );
grip.rotation.z = 0.28;
const guard = mesh( new THREE.TorusGeometry( 0.42, 0.05, 8, 24, Math.PI ), darkSteel, - 1.05, - 0.35, 0 );
guard.rotation.z = Math.PI;

const trigger = new THREE.Group();
trigger.position.set( - 1.15, - 0.1, 0 );
gun.add( trigger );
mesh( new THREE.BoxGeometry( 0.1, 0.5, 0.1 ), steel, 0, - 0.2, 0, trigger ).rotation.z = 0.2;

const hammer = new THREE.Group();
hammer.position.set( - 2.25, 0.85, 0 );
gun.add( hammer );
mesh( new THREE.BoxGeometry( 0.2, 0.55, 0.16 ), steel, - 0.05, 0.2, 0, hammer );

gun.position.set( - 0.4, 0, 0 );

// muzzle flash
function glowTexture() {

	const c = document.createElement( 'canvas' );
	c.width = c.height = 128;
	const g = c.getContext( '2d' );
	const grd = g.createRadialGradient( 64, 64, 0, 64, 64, 64 );
	grd.addColorStop( 0, 'rgba(255,255,255,1)' );
	grd.addColorStop( 0.25, 'rgba(255,200,90,0.9)' );
	grd.addColorStop( 1, 'rgba(255,90,0,0)' );
	g.fillStyle = grd;
	g.fillRect( 0, 0, 128, 128 );
	return new THREE.CanvasTexture( c );

}
const flashSprite = new THREE.Sprite( new THREE.SpriteMaterial( { map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true } ) );
flashSprite.position.set( 3.6, R_RING, 0 );
flashSprite.visible = false;
gun.add( flashSprite );
const flashLight = new THREE.PointLight( 0xffa040, 0, 12 );
flashLight.position.set( 3.6, R_RING, 0 );
gun.add( flashLight );

// ---------- tiny tween engine ----------
const tweens = [];
const ease = { out: t => 1 - Math.pow( 1 - t, 3 ), inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow( - 2 * t + 2, 2 ) / 2, lin: t => t };
function tween( dur, fn, easing = ease.lin ) {

	return new Promise( res => tweens.push( { t: 0, dur, fn, easing, res } ) );

}
const wait = s => tween( s, () => {} );

// ---------- audio ----------
let actx;
function audio() {

	if ( ! actx ) { try { actx = new ( window.AudioContext || window.webkitAudioContext )(); } catch ( e ) {} }
	if ( actx && actx.state === 'suspended' ) actx.resume();
	return actx;

}
function noise( dur, filterType, f0, f1, gain ) {

	const a = audio(); if ( ! a ) return;
	const buf = a.createBuffer( 1, Math.ceil( a.sampleRate * dur ), a.sampleRate );
	const d = buf.getChannelData( 0 );
	for ( let i = 0; i < d.length; i ++ ) d[ i ] = ( Math.random() * 2 - 1 ) * Math.pow( 1 - i / d.length, 2 );
	const src = a.createBufferSource(); src.buffer = buf;
	const f = a.createBiquadFilter(); f.type = filterType;
	f.frequency.setValueAtTime( f0, a.currentTime );
	f.frequency.exponentialRampToValueAtTime( f1, a.currentTime + dur );
	const g = a.createGain(); g.gain.value = gain;
	src.connect( f ).connect( g ).connect( a.destination );
	src.start();

}
function tone( freq, dur, gain, type = 'sine', fEnd = freq ) {

	const a = audio(); if ( ! a ) return;
	const o = a.createOscillator(); o.type = type;
	o.frequency.setValueAtTime( freq, a.currentTime );
	o.frequency.exponentialRampToValueAtTime( fEnd, a.currentTime + dur );
	const g = a.createGain();
	g.gain.setValueAtTime( gain, a.currentTime );
	g.gain.exponentialRampToValueAtTime( 0.0001, a.currentTime + dur );
	o.connect( g ).connect( a.destination );
	o.start(); o.stop( a.currentTime + dur );

}
const sfx = {
	tick: () => { tone( 1800 + Math.random() * 300, 0.03, 0.06, 'square' ); },
	click: () => { noise( 0.05, 'highpass', 3000, 6000, 0.5 ); tone( 900, 0.06, 0.12, 'square', 400 ); },
	cock: () => { noise( 0.08, 'bandpass', 1500, 2500, 0.3 ); tone( 600, 0.08, 0.1, 'square', 900 ); },
	bang: () => { noise( 0.9, 'lowpass', 6000, 120, 1.4 ); tone( 140, 0.5, 0.8, 'sine', 35 ); }
};

// ---------- game state ----------
let rot = 0; // cylinder angle; chamber k is at the top when rot ≡ -k*STEP
let cur = 0; // chamber currently under the hammer
let bullet = 0;
let pulls = 0; // pulls since the last spin
let score = 0;
let state = 'busy'; // idle | busy | dead
let recoil = 0, shake = 0;

function setMsg( t ) { msgEl.textContent = t; }
function updateUI() {

	const left = CHAMBERS - pulls;
	oddsEl.textContent = state === 'dead' ? '' : `다음 발사 위험 확률: ${Math.round( 100 / left )}%  (남은 칸 ${left}/${CHAMBERS})`;
	scoreEl.textContent = score;
	spinBtn.disabled = pullBtn.disabled = state !== 'idle';

}

function spinTo( k ) {

	const base = - k * STEP;
	const n = Math.ceil( ( base - rot + 6 * Math.PI ) / ( 2 * Math.PI ) );
	const to = base - 2 * Math.PI * n, from = rot;
	let lastTick = Math.floor( rot / STEP );
	return tween( 2.2, t => {

		rot = from + ( to - from ) * t;
		const idx = Math.floor( rot / STEP );
		if ( idx !== lastTick ) { lastTick = idx; sfx.tick(); }

	}, ease.out ).then( () => { rot = to; } );

}

async function newGame() {

	state = 'busy';
	overEl.classList.remove( 'show' );
	score = 0; pulls = 0;
	bullet = Math.floor( Math.random() * CHAMBERS );
	rounds.forEach( ( r, i ) => r.visible = i === bullet );
	setMsg( '총알 1발을 장전합니다…' );
	updateUI();
	await wait( 1.4 );
	rounds.forEach( r => r.visible = false );
	setMsg( '탄창을 닫고 돌립니다…' );
	cur = Math.floor( Math.random() * CHAMBERS );
	await spinTo( cur );
	setMsg( '방아쇠를 당길 준비가 되었나요?' );
	state = 'idle';
	updateUI();

}

async function spin() {

	if ( state !== 'idle' ) return;
	audio();
	state = 'busy'; updateUI();
	setMsg( '탄창을 돌립니다…' );
	cur = Math.floor( Math.random() * CHAMBERS );
	pulls = 0;
	await spinTo( cur );
	setMsg( '다시 섞었습니다. 확률은 1/6로 초기화됩니다.' );
	state = 'idle'; updateUI();

}

async function pull() {

	if ( state !== 'idle' ) return;
	audio();
	state = 'busy'; updateUI();
	setMsg( '…' );

	sfx.cock();
	const hammerBack = tween( 0.35, t => { hammer.rotation.z = 0.7 * t; trigger.rotation.z = - 0.35 * t; }, ease.out );
	await hammerBack;
	await wait( 0.45 + Math.random() * 0.5 ); // suspense
	await tween( 0.05, t => { hammer.rotation.z = 0.7 * ( 1 - t ); }, ease.lin );

	if ( cur === bullet ) {

		bang();
		return;

	}

	sfx.click();
	shake = 0.04;
	score ++; pulls ++;
	setMsg( '찰칵… 살아남았습니다.' );
	await tween( 0.2, t => { trigger.rotation.z = - 0.35 * ( 1 - t ); }, ease.out );

	cur = ( cur + 1 ) % CHAMBERS;
	const from = rot;
	await tween( 0.3, t => { rot = from - STEP * t; }, ease.inOut );
	rot = from - STEP;
	sfx.tick();

	state = 'idle'; updateUI();

}

async function bang() {

	state = 'dead';
	sfx.bang();
	rounds.forEach( ( r, i ) => r.visible = i === bullet );
	flashSprite.visible = true;
	recoil = 1; shake = 0.35;
	setMsg( '' );
	flashEl.style.opacity = '1';
	await tween( 0.6, t => {

		flashEl.style.opacity = String( 1 - t );
		flashLight.intensity = 400 * ( 1 - t );
		flashSprite.material.opacity = 1 - t;
		flashSprite.scale.setScalar( 1.5 + 2 * t );

	}, ease.out );
	flashSprite.visible = false;
	flashLight.intensity = 0;

	if ( score > best ) {

		best = score;
		bestEl.textContent = best;
		try { localStorage.setItem( 'roulette-best', String( best ) ); } catch ( e ) {}

	}
	overText.textContent = score > 0 ? `${score}번 살아남았습니다.` : '첫 발에 당했습니다…';
	overEl.classList.add( 'show' );
	updateUI();

}

spinBtn.onclick = spin;
pullBtn.onclick = pull;
againBtn.onclick = () => { audio(); newGame(); };
addEventListener( 'keydown', e => {

	if ( e.repeat ) return;
	if ( e.code === 'Space' ) { e.preventDefault(); if ( state === 'dead' ) { audio(); newGame(); } else pull(); }
	else if ( e.code === 'KeyS' ) spin();

} );

// ---------- loop ----------
const mouse = new THREE.Vector2();
addEventListener( 'pointermove', e => { mouse.set( e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1 ); } );
addEventListener( 'resize', () => {

	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize( innerWidth, innerHeight );

} );

const clock = new THREE.Clock();
renderer.setAnimationLoop( () => {

	const dt = Math.min( clock.getDelta(), 0.05 );
	const time = clock.elapsedTime;

	for ( let i = tweens.length - 1; i >= 0; i -- ) {

		const tw = tweens[ i ];
		tw.t += dt;
		const p = Math.min( tw.t / tw.dur, 1 );
		tw.fn( tw.easing( p ) );
		if ( p >= 1 ) { tweens.splice( i, 1 ); tw.res(); }

	}

	cyl.rotation.x = rot;

	recoil *= Math.pow( 0.002, dt );
	gun.rotation.z = recoil * 0.45;
	gun.position.x = - 0.4 - recoil * 0.5;
	gun.position.y = Math.sin( time * 1.2 ) * 0.03;

	shake *= Math.pow( 0.005, dt );
	camera.position.set(
		camBase.x + mouse.x * 0.6 + ( Math.random() - 0.5 ) * shake,
		camBase.y - mouse.y * 0.4 + ( Math.random() - 0.5 ) * shake,
		camBase.z + ( Math.random() - 0.5 ) * shake
	);
	camera.lookAt( camTarget );

	renderer.render( scene, camera );

} );

newGame();
</script>
</body>
</html>
